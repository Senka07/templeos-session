# Terminal da sessao TempleOS (kitty --config): o "Adam Task" do original.
# Fundo branco, paleta VGA de gr_palette_std, fonte Temple Std a 12px (9pt a
# 96 DPI; o sessao.sh fixa Xft.dpi). 8px fica pequeno demais para ler e 16px
# come a tela; 1,5x deixa alguns tracos com 1px e outros com 2px, mas foi o
# melhor meio-termo. Molduras e status ficam a 2x.
# Texto comum em preto (em azul o cat de um arquivo grande cansa); o prompt
# continua azul pelo zshrc.
font_family      Temple Std
font_size        9.0
disable_ligatures always
# zsh mesmo que o shell de login seja outro: o prompt C:/Home> vem do zshrc da sessao
shell zsh

foreground       #000000
background       #FFFFFF
selection_foreground #FFFFFF
selection_background #0000AA
cursor           #FFFF55
cursor_text_color #0000AA
cursor_shape     block
# Blink() de Kernel/KMisc.HC: 2,5 Hz
cursor_blink_interval 0.2
cursor_stop_blinking_after 0
url_color        #AA0000
url_style        straight

# ANSI -> paleta do TempleOS (a ordem do ANSI e diferente da do TempleOS)
color0  #000000
color1  #AA0000
color2  #00AA00
color3  #AA5500
color4  #0000AA
color5  #AA00AA
color6  #00AAAA
color7  #AAAAAA
color8  #555555
color9  #FF5555
color10 #55FF55
color11 #FFFF55
color12 #5555FF
color13 #FF55FF
color14 #55FFFF
color15 #FFFFFF

window_padding_width 0
placement_strategy top-left
remember_window_size no
# Tamanho dos terminais abertos depois (Term, Ctrl+Alt+T): cabe ate em 1024x768.
# O primeiro terminal da sessao recebe o tamanho calculado pelo atalhos.py.
initial_window_width  50c
initial_window_height 40c
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no
tab_bar_style hidden
linux_display_server x11
