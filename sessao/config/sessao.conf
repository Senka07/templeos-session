# Local settings for the TempleOS session, read by sessao.sh at login.
# Edit the copy in ~/.config/templeos/sessao.conf.

# Keyboard layout. Left empty, the session keeps whatever X already has
# (/etc/X11/xorg.conf.d). Example: two layouts, Alt+Shift switches.
#XKB_LAYOUT=br,us
#XKB_OPTIONS=grp:alt_shift_toggle
#XKB_MODEL=pc105+inet

# The monitor stays on, like the original. 0 goes back to the X default, which
# turns it off after 10 minutes idle.
#TEMPLEOS_TELA_ACESA=0

# Lock the screen after this many minutes without keyboard or mouse. Empty or 0
# keeps it off, like the original, which has no screen saver. Players asking
# the screen to stay on (Firefox, mpv, VLC, games) hold the countdown.
#TEMPLEOS_BLOQUEIO_MIN=10

# If the screen locker fails, this runs instead of leaving the session open.
# The default talks to LightDM; on GDM or SDDM use a locker you have installed.
#TEMPLEOS_RESERVA_BLOQUEIO="i3lock -c 0000aa"

# Last key pressed, shown in the top right corner like the original.
# 0 hides it (handy for screenshots).
#TEMPLEOS_TECLA=0

# 0 keeps the PersonalMenu hidden at login (Ctrl+M shows it).
#TEMPLEOS_MENU_INICIAL=0
