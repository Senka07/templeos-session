<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- TempleOS: a Temple Std e de pixels; sem suavizacao nem hinting ela sai
     exata em multiplos de 8px (16px = 12pt a 96 DPI). -->
<fontconfig>
  <match target="font">
    <test name="family" compare="eq"><string>Temple Std</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting"   mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
